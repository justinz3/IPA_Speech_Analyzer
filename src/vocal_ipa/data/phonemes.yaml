# Per-phoneme reference inventory for the coaching layer.
#
# Each entry is keyed on the IPA token the model emits / phonemizer outputs.
# Fields:
#   name    — the canonical IPA name (e.g., "voiced bilabial fricative")
#   image   — relative path under data/phonemes/ to a sagittal articulator
#             diagram (PNG/SVG). Sourced from Wikimedia Commons; null until
#             the curation commit fills these in.
#   audio   — relative path under data/phonemes/ to an OGG/WAV reference
#             pronunciation. Same source. null until curated.
#   video   — optional URL to a tutorial video. null in v1.
#   notes   — optional language-specific prose. Keyed by language code.
#
# Token coverage: every distinct token that appears in the existing es+fr
# fixtures (transcribe goldens + reference-IPA tokenization) plus a few
# referenced by spanish_failure_modes.md / french_failure_modes.md (tʃ,
# dʒ, eː, oː). Multi-char "tokens" like 'aʊ', 'oɪ', 'ja', 'ie', 'yi' are
# vocab artifacts — they're entries in the wav2vec2 vocab that the model
# emits as single units rather than two-character sequences.

# -- Vowels: oral monophthongs --

a:
  name: open front unrounded vowel
  image: phonemes/a_pos.svg
  audio: phonemes/a_audio.ogg
  video: null
  notes:
    es: "Spanish `a` — pure, no glide. Position constant from start to end."
    fr: "French `a` in `ami`, `papa`."
  examples:
    es: "p**a**so, c**a**sa"
    fr: "p**a**tte, l**à**, femme"
    ja: "**あ**る (aru)"

e:
  name: close-mid front unrounded vowel
  image: phonemes/e_pos.svg
  audio: phonemes/e_audio.ogg
  video: null
  notes:
    es: "Spanish `e` — same height as French `é`; no glide."
    fr: "French `é` in `été`."
  examples:
    es: "p**e**so, m**e**sa"
    fr: "cl**é**, ch**e**z, all**e**r"
    ja: "**え**き (eki)"

i:
  name: close front unrounded vowel
  image: phonemes/i_pos.svg
  audio: phonemes/i_audio.ogg
  video: null
  notes:
    en: "English `ee` in `see`. Tongue high and front, lips spread."
  examples:
    en: "fl**ee**ce, s**ee**, b**e**"
    es: "p**i**so, s**i**, **y**"
    fr: "s**i**, **î**le, rég**ie**"
    ja: "**い**る (iru)"

o:
  name: close-mid back rounded vowel
  image: phonemes/o_pos.svg
  audio: phonemes/o_audio.ogg
  video: null
  notes:
    es: "Spanish `o` — pure, no glide to /ʊ/ as in English."
  examples:
    es: "p**o**so, c**o**sa"
    fr: "s**au**t, bure**au**, ch**o**se"
    ja: "**お**に (oni)"

u:
  name: close back rounded vowel
  image: phonemes/u_pos.svg
  audio: phonemes/u_audio.ogg
  video: null
  notes:
    es: "Spanish `u` — pure, no glide."
    fr: "French `ou` in `tout`. Distinguished from /y/ which is front rounded."
  examples:
    en: "g**oo**se, bl**ue**"
    es: "p**u**so, l**u**na"
    fr: "c**ou**p, r**ou**e"
    ja: "**う**なぎ (unagi)"

y:
  name: close front rounded vowel
  image: phonemes/y_pos.svg
  audio: phonemes/y_audio.ogg
  video: null
  notes:
    fr: "French `u` in `tu`, `lune`, `huit`. No English equivalent — round the lips as for /u/ but place the tongue as for /i/."
  examples:
    fr: "t**u**, s**û**r, r**ue**"

ø:
  name: close-mid front rounded vowel
  image: phonemes/oe-mid_pos.svg
  audio: phonemes/oe-mid_audio.ogg
  video: null
  notes:
    fr: "French `eu` in `peu`, `bleues`. Front rounded — say `é` with rounded lips."
  examples:
    fr: "p**eu**, c**eu**x, qu**eue**"

œ:
  name: open-mid front rounded vowel
  image: phonemes/oe-open_pos.svg
  audio: phonemes/oe-open_audio.ogg
  video: null
  notes:
    fr: "French `œu` in `fleurs`, `peur`. More open than /ø/."
  examples:
    fr: "s**œu**r, p**eu**r, j**eu**ne"

ɛ:
  name: open-mid front unrounded vowel
  image: phonemes/eps_pos.svg
  audio: phonemes/eps_audio.ogg
  video: null
  notes:
    en: "English DRESS vowel — `e` in `bed`, `said`, `friend`."
    fr: "French `è` in `mère`, `plaît`. More open than /e/."
  examples:
    en: "dr**e**ss, b**e**d, s**ai**d, fr**ie**nd"
    fr: "b**ai**e, f**ai**te, cr**è**me, m**è**re"

ɔ:
  name: open-mid back rounded vowel
  image: phonemes/open-o_pos.svg
  audio: phonemes/open-o_audio.ogg
  video: null
  notes:
    fr: "French `o` in `homme`, `bord`. More open than /o/."
  examples:
    fr: "s**o**rt, p**o**mme, h**o**mme"

ə:
  name: mid central vowel (schwa)
  image: phonemes/schwa_pos.svg
  audio: phonemes/schwa_audio.ogg
  video: null
  notes:
    fr: "French `e` in `je`, `petit`. Often dropped in casual speech but kept in formal."
    en: "English unstressed vowel as in `sofa`."

# -- Length marks (model-emitted, decorative on Spanish) --
  examples:
    en: "comm**a**, ab**o**ut, th**e**"
    fr: "r**e**poser, j**e**, p**e**tit"

eː:
  name: close-mid front unrounded vowel (long)
  image: null
  audio: null
  video: null
  notes:
    es: "Vowel-length marks are not phonemic in Spanish; the model emits them on stressed/held vowels. Treat as decoration of /e/."

oː:
  name: close-mid back rounded vowel (long)
  image: null
  audio: null
  video: null
  notes:
    es: "Vowel-length marks are not phonemic in Spanish; the model emits them on stressed/held vowels. Treat as decoration of /o/."

# -- Vowels: nasals (combining tilde) --

ɑ̃:
  name: open back nasal vowel
  image: phonemes/alpha-nas_pos.svg
  audio: phonemes/alpha-nas_audio.ogg
  video: null
  notes:
    fr: "French `an`/`en` in `grand`, `comment`. Nasalize while pronouncing the vowel."
  examples:
    fr: "s**an**s, ch**am**p, v**en**t, t**em**ps"

ɛ̃:
  name: open-mid front nasal vowel
  image: phonemes/eps-nas_pos.svg
  audio: phonemes/eps-nas_audio.ogg
  video: null
  notes:
    fr: "French `in`/`ain` in `vin`, `pain`. No English analogue."
  examples:
    fr: "v**in**, imp**ai**r, p**ain**, pl**ein**"

ɔ̃:
  name: open-mid back nasal vowel
  image: phonemes/open-o-nas_pos.svg
  audio: phonemes/open-o-nas_audio.ogg
  video: null
  notes:
    fr: "French `on` in `bon`, `bonjour`."
  examples:
    fr: "s**on**, n**om**, b**on**"

œ̃:
  name: open-mid front rounded nasal vowel
  image: phonemes/oe-nas_pos.svg
  audio: phonemes/oe-nas_audio.ogg
  video: null
  notes:
    fr: "French `un` in `un`, `parfum`. Many Parisian speakers merge /œ̃/ with /ɛ̃/; phonemizer keeps them distinct."

# -- Glides / vocab-fused two-vowel tokens --
  examples:
    fr: "**un**, parf**um**"

j:
  name: voiced palatal approximant
  image: null
  audio: null
  video: null
  notes:
    en: "English `y` in `yes`."
  examples:
    es: "**Vi**ena, re**y**"
    fr: "fie**f**, pa**y**er, fi**ll**e"
    ja: "**や**くしゃ (yakusha), **ゆ**ず (yuzu)"

w:
  name: voiced labio-velar approximant
  image: null
  audio: null
  video: null
  notes:
    es: "Spanish `u` before another vowel in `bueno`, `puerto`."
  examples:
    es: "H**u**ila, a**u**to, **w**eb"
    fr: "**ou**i, lo**i**"
    ja: "**わ**さび (wasabi)"

aʊ:
  name: open-to-near-close diphthong (/a/ → /ʊ/)
  image: null
  audio: null
  video: null
  notes:
    en: "English `ow` in `now`. Spanish vowels do *not* glide; if you see /aʊ/ where the reference is just /a/, that's English diphthongization."
  examples:
    en: "m**ou**th, h**ow**, n**ow**"

oɪ:
  name: close-mid back to near-close front diphthong (/o/ → /ɪ/)
  image: null
  audio: null
  video: null
  notes:
    en: "English `oy` in `boy`. Spanish vowels do *not* glide; /oɪ/ for /o/ is English diphthongization."

ja:
  name: glide + open vowel sequence (/j a/)
  image: null
  audio: null
  video: null
  notes:
    es: "Vocab artifact — the model treats /ja/ as a single token. Appears in `día → dja → d ja` when accents are missing on the reference."

ie:
  name: vowel sequence (/i e/)
  image: null
  audio: null
  video: null
  notes:
    es: "Vocab artifact — `ie` appears as a single token in `tiempo`, `siempre`."

yi:
  name: front rounded vowel + close front (/y i/)
  image: null
  audio: null
  video: null
  notes:
    fr: "Vocab artifact in `huit → yit` (phonemizer doesn't emit /ɥ/, so /ɥi/ is approximated as /yi/)."

# -- Consonants: stops --

p:
  name: voiceless bilabial stop
  image: null
  audio: null
  video: null
  examples:
    cmn: "**帮** (bāng)"
    en: "**p**ie, s**p**y, ca**p**"
    es: "**p**ato, lu**p**a"
    fr: "**p**ère, grou**p**e"
    ja: "**パ**ン (pan)"

b:
  name: voiced bilabial stop
  image: null
  audio: null
  video: null
  notes:
    es: "Spanish `b` is realized as [β] (bilabial fricative) between vowels; only stop-form in absolute initial position or after /m/, /n/."

t:
  name: voiceless alveolar stop
  image: null
  audio: null
  video: null
  notes:
    es: "Spanish /t/ is dental, not alveolar — tongue tip touches the back of upper teeth, not the alveolar ridge."
  examples:
    cmn: "**端** (duān)"
    en: "**t**ie, s**t**y, ca**t**"
    es: "**t**amiz"
    fr: "**t**out, **th**é"
    ja: "**た**べる (taberu)"

d:
  name: voiced alveolar stop
  image: null
  audio: null
  video: null
  notes:
    es: "Spanish /d/ is realized as [ð] (dental fricative) between vowels; only stop-form initially or after /n/, /l/."

k:
  name: voiceless velar stop
  image: null
  audio: null
  video: null
  examples:
    cmn: "**干** (gān)"
    en: "**k**ind, s**k**y, cra**ck**"
    es: "**c**aso, **qu**e, **k**ilo"
    fr: "co**r**ps, ave**c**, **qu**and"
    ja: "**く**る (kuru)"

ɡ:
  name: voiced velar stop
  image: null
  audio: null
  video: null
  notes:
    es: "Spanish /g/ is realized as [ɣ] (velar fricative) between vowels."

# -- Consonants: fricatives --

f:
  name: voiceless labiodental fricative
  image: null
  audio: null
  video: null
  examples:
    en: "**f**ind, lea**f**"
    es: "**f**aro"
    fr: "**f**aire, vi**f**"

v:
  name: voiced labiodental fricative
  image: null
  audio: null
  video: null
  notes:
    en: "English `v` in `vine`. Lower lip touches upper teeth."
    es: "Spanish does NOT use /v/ — both written `v` and intervocalic `b` realize as [β], the bilabial fricative."

s:
  name: voiceless alveolar fricative
  image: null
  audio: null
  video: null
  examples:
    en: "**s**igh, ma**ss**"
    es: "**s**aco, ca**s**a, e**s**tá"
    fr: "**s**ans, ça, a**ss**ez"
    ja: "**す**る (suru)"

z:
  name: voiced alveolar fricative
  image: null
  audio: null
  video: null
  notes:
    fr: "French `z` in `zéro`, also liaison `s` between vowel-final + vowel-initial words (`les amis → lez ami`)."

θ:
  name: voiceless dental fricative
  image: null
  audio: phonemes/theta_audio.ogg
  video: null
  notes:
    en: "English `th` in `thin`, `think`, `through`. Tongue tip between teeth; NO puff of air."
    es: "Castilian Spanish `z` and soft `c` (`manzana`, `cinco`). Latin American Spanish uses /s/ instead — set --dialect es-419."
  examples:
    en: "**th**igh, pa**th**, **th**ing"
    es: "c**e**ra, ca**z**a (Castilian)"

ð:
  name: voiced dental fricative
  image: null
  audio: phonemes/eth_audio.ogg
  video: null
  notes:
    en: "English `th` in `this`, `the`, `there`. Voiced version of /θ/ — tongue tip between teeth with vocal cords vibrating."
    es: "Realization of intervocalic /d/ in Spanish (`nada → naða`)."
  examples:
    en: "**th**y, brea**th**e, fa**th**er"
    es: "de**d**o (intervocalic), ca**d**a, ar**d**e"

ʃ:
  name: voiceless postalveolar fricative
  image: null
  audio: phonemes/esh_audio.ogg
  video: null
  notes:
    en: "English `sh` in `she`."
  examples:
    en: "**sh**y, ca**sh**, emo**ti**on"
    es: "**sh**ow (loanword), Frei**x**enet"
    fr: "**ch**ance, t**ch**èque"

ʒ:
  name: voiced postalveolar fricative
  image: null
  audio: phonemes/ezh_audio.ogg
  video: null
  notes:
    en: "English `s` in `vision`, `measure`, `pleasure`."
    fr: "French `j` in `je`, `jour`."
  examples:
    en: "plea**s**ure, bei**ge**, mea**s**ure"
    fr: "**j**amais, vi**s**age"

x:
  name: voiceless velar fricative
  image: null
  audio: phonemes/x_audio.ogg
  video: null
  notes:
    es: "Spanish `j` in `jardín`, `mujer`. Back-of-throat scrape, NOT English /h/."
  examples:
    cmn: "**火** (huǒ), **好** (hǎo)"
    es: "**j**arra, **g**ente, Mé**x**ico"

h:
  name: voiceless glottal fricative
  image: null
  audio: null
  video: null
  notes:
    en: "English `h` in `hat`. Spanish does NOT have /h/ — if the model emits /h/ in a Spanish context, you're substituting English /h/ for Spanish /x/."

ɣ:
  name: voiced velar fricative
  image: null
  audio: phonemes/gamma_audio.ogg
  video: null
  notes:
    es: "Realization of intervocalic /g/ in Spanish (`agua → aɣwa`)."
  examples:
    es: "gal**g**o (intervocalic), si**g**no, á**g**uila"

β:
  name: voiced bilabial fricative
  image: null
  audio: phonemes/beta_audio.ogg
  video: null
  notes:
    es: "Realization of /b/ and /v/ between vowels in Spanish. Lips touch lightly without contact between lower lip and upper teeth."
  examples:
    es: "be**b**é (intervocalic), fút**b**ol"

ʁ:
  name: voiced uvular fricative
  image: null
  audio: phonemes/uvular-r_audio.ogg
  video: null
  notes:
    fr: "French `r`. Back-of-throat zone, similar to German `ach` or Spanish /x/. Different articulation from English /r/."

# -- Consonants: affricates --
  examples:
    fr: "**r**ega**r**der, **r**ue, nôt**r**e"

tʃ:
  name: voiceless postalveolar affricate
  image: null
  audio: phonemes/tesh_audio.ogg
  video: null
  notes:
    es: "Spanish `ch` in `leche`, `mucho`. Stays voiceless even between vowels."
    en: "English `ch` in `chair`."
  examples:
    en: "**Ch**ina, cat**ch**, **ch**urch"
    es: "**ch**ico, mu**ch**o"
    fr: "t**ch**èque"

dʒ:
  name: voiced postalveolar affricate
  image: null
  audio: null
  video: null
  notes:
    en: "English `j` in `jam`. Spanish `ch` should NOT voice between vowels — keep it /tʃ/."

# -- Consonants: nasals --

m:
  name: voiced bilabial nasal
  image: null
  audio: null
  video: null
  examples:
    en: "**m**y, ca**m**"
    es: "**m**eta, ca**m**a"
    fr: "**m**ême"
    ja: "**み**かん (mikan)"

n:
  name: voiced alveolar nasal
  image: null
  audio: null
  video: null
  notes:
    es: "Assimilates to following consonant: `un buen` → `[um bwen]` (n→m before bilabial)."
  examples:
    en: "**n**igh, ca**n**"
    es: "**n**i, ca**n**a, si**n**"
    fr: "**n**ous, bo**nn**e"
    ja: "**な**っとう (natto)"

ɲ:
  name: voiced palatal nasal
  image: null
  audio: phonemes/palatal-n_audio.ogg
  video: null
  notes:
    es: "Spanish `ñ` in `niño`, `año`."
    fr: "French `gn` in `agneau`, `montagne`."

# -- Consonants: liquids --
  examples:
    es: "**ñ**u, ca**ñ**a, có**ny**uge"
    fr: "ga**gn**er, champa**gn**e"
    ja: "**に**わ (niwa), こん**にゃ**く (konnyaku)"

l:
  name: voiced alveolar lateral approximant
  image: null
  audio: null
  video: null
  notes:
    es: "Spanish /l/ stays clear (no `dark l` velarization) in all positions, unlike American English coda /l/."
  examples:
    en: "**l**ie, ga**l**"
    es: "**l**una, ha**l**a"
    fr: "**l**aisser, seu**l**"

r:
  name: voiced alveolar trill
  image: null
  audio: phonemes/trill_audio.ogg
  video: null
  notes:
    es: "Spanish trilled `r` — multiple taps. Used for `rr` (`perro`) and word-initial `r` (`rosa`). Single intervocalic `r` is the tap /ɾ/, not /r/."
  examples:
    es: "**r**ío, ca**rr**o, hon**r**a"

ɾ:
  name: voiced alveolar tap
  image: null
  audio: phonemes/tap_audio.ogg
  video: null
  notes:
    en: "American English flap — `tt`/`dd` in `butter`, `ladder`, `better`. Appears between vowels when the following vowel is unstressed."
    es: "Spanish single `r` (`pero`, `caro`). Same articulation as the `tt` in American English `butter`. NOT a trill."
  examples:
    es: "ca**r**o, pe**r**o, pe**r**a"
    ja: "**ろ**く (roku), そ**ら** (sora)"

ʎ:
  name: voiced palatal lateral approximant
  image: null
  audio: null
  video: null
  notes:
    es: "Spanish `ll` in conservative dialects. Most modern speakers use /ʝ/ or /j/ instead (yeísmo)."


# === Mandarin (Phase 5a) ===
# espeak's cmn-latn-pinyin voice convention. Tones are baked into vowel
# tokens (digit suffix or vowel-quality shift); the mapping is not 1:1
# with pinyin tone numbers (espeak's '5' covers tones 1+4, etc.).
# Phase 6 will add proper per-syllable pitch-contour scoring.


kh:
  name: 'voiceless aspirated velar plosive'
  image: null
  audio: null
  video: null
  notes:
    cmn: "Pinyin 'k' initial (kāi 开). Strong burst of air."

ph:
  name: 'voiceless aspirated bilabial plosive'
  image: null
  audio: null
  video: null
  notes:
    cmn: "Pinyin 'p' initial (pà 怕)."

th:
  name: 'voiceless aspirated alveolar plosive'
  image: null
  audio: null
  video: null
  notes:
    cmn: "Pinyin 't' initial (tā 他)."

's.':
  name: 'voiceless retroflex sibilant fricative'
  image: null
  audio: null
  video: null
  notes:
    cmn: "Pinyin 'sh' initial. Tongue tip curled slightly back."

ts:
  name: 'voiceless alveolar affricate'
  image: null
  audio: null
  video: null
  notes:
    cmn: "Pinyin 'z' initial (zài 在)."

tsh:
  name: 'voiceless aspirated alveolar affricate'
  image: null
  audio: null
  video: null
  notes:
    cmn: "Pinyin 'c' initial (cài 菜)."

'ts.':
  name: 'voiceless retroflex affricate'
  image: null
  audio: null
  video: null
  notes:
    cmn: "Pinyin 'zh' initial. Retroflex 'sh' plus a stop release."

'ts.h':
  name: 'voiceless aspirated retroflex affricate'
  image: null
  audio: null
  video: null
  notes:
    cmn: "Pinyin 'ch' initial."

tɕ:
  name: 'voiceless alveolo-palatal affricate'
  image: null
  audio: null
  video: null
  notes:
    cmn: "Pinyin 'j' initial. Tongue blade against alveolar+palate."

tɕh:
  name: 'voiceless aspirated alveolo-palatal affricate'
  image: null
  audio: null
  video: null
  notes:
    cmn: "Pinyin 'q' initial."
  examples:
    cmn: "**去** (qù), **请** (qǐng)"

ɕ:
  name: 'voiceless alveolo-palatal fricative'
  image: null
  audio: null
  video: null
  notes:
    cmn: "Pinyin 'x' initial. Softer than English 'sh' with palate contact."
  examples:
    cmn: "**晓** (xiǎo)"
    ja: "**し**た (shita), いっ**しょ**う (isshou)"

ʐ:
  name: 'voiced retroflex fricative'
  image: null
  audio: null
  video: null
  notes:
    cmn: "Pinyin 'r' initial. Often realized as approximant ɻ in casual speech."
  examples:
    cmn: "**日** (rì)"

χ:
  name: 'voiceless uvular fricative'
  image: null
  audio: null
  video: null
  notes:
    cmn: "Pinyin 'h' initial — espeak's cmn-latn-pinyin voice emits the uvular variant."
  examples:
    cmn: "**好** (hǎo — variant of x)"

ŋ:
  name: 'voiced velar nasal'
  image: null
  audio: null
  video: null
  notes:
    en: "English `ng` in `ring`, `sing`, `thing`. Also in `n` before /k/ and /g/ (`bank`, `angry`)."
    cmn: "Pinyin 'ng' coda (zhōng 中). Mandarin syllables often end in -ng."
  examples:
    cmn: "**江** (jiāng), **明** (míng)"
    en: "sa**ng**, si**nk**, si**ng**er"
    es: "te**ng**o"
    fr: "campi**ng**, fu**nk**"
    ja: "り**ん**ご (ringo), な**ん**きょく (nankyoku)"

ʲ:
  name: 'palatalization marker'
  image: null
  audio: null
  video: null
  notes:
    cmn: 'Off-glide /y/ after vowels (tian → tʲɛn). Marks palatal coloring of the preceding consonant or following vowel.'

a5:
  name: 'open central unrounded vowel (espeak tone marker 5)'
  image: null
  audio: null
