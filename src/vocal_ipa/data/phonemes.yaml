  image: null
  audio: null
  video: null
  notes:
    en: "American English FORCE vowel — `or` in `more`, `store`, `four`."

ɔːɹ:
  name: open-mid back rounded vowel + rhotic (NORTH)
  image: null
  audio: null
  video: null
  notes:
    en: "American English NORTH vowel — `or` in `for`, `born`, `short`. Merges with /oːɹ/ in many American accents."

ɛɹ:
  name: open-mid front unrounded vowel + rhotic (SQUARE)
  image: null
  audio: null
  video: null
  notes:
    en: "American English SQUARE vowel — `are` in `care`, `there`, `wear`."

ɪɹ:
  name: near-close near-front unrounded vowel + rhotic (NEAR)
  image: null
  audio: null
  video: null
  notes:
    en: "American English NEAR vowel — `ear` in `fear`, `beer`, `here`."

ʊɹ:
  name: near-close near-back rounded vowel + rhotic (CURE)
  image: null
  audio: null
