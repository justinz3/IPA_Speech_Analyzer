ʌ:
  name: open-mid back unrounded vowel
  image: null
  audio: null
  video: null
  notes:
    en: "English STRUT vowel — `u` in `but`, `cup`, `love`."
  examples:
    en: "str**u**t, s**u**ng, bl**oo**d"

ʊ:
  name: near-close near-back rounded vowel
  image: null
  audio: null
  video: null
  notes:
    en: "English FOOT vowel — `oo` in `book`, `put`, `could`. Shorter and more relaxed than /uː/."
  examples:
    en: "f**oo**t, h**oo**k, p**u**t"

ɜː:
  name: open-mid central unrounded vowel (long)
  image: null
  audio: null
  video: null
  notes:
    en: "English NURSE vowel — `er` in `bird`, `word`, `learn`. No equivalent in Spanish or French."
  examples:
    en: "n**ur**se, b**ir**d, h**ear**d"

ɚ:
  name: r-colored mid central vowel
  image: null
  audio: null
  video: null
  notes:
    en: "American English LETTER vowel — unstressed `er` in `butter`, `father`, `actor`. Non-rhotic accents (en-gb) use /ə/ here instead."

ɑː:
  name: open back unrounded vowel (long)
  image: null
  audio: null
  video: null
  notes:
    en: "American English LOT/PALM vowel — `a` in `father`, `spa`; also `o` in `hot`, `stop` (cot–caught merger)."
  examples:
    en: "p**al**m, br**a**, f**a**ther"

eɪ:
  name: close-mid front to near-close diphthong
  image: null
  audio: null
  video: null
  notes:
    en: "English FACE vowel — `a` in `day`, `say`, `they`. Glides from /e/ toward /ɪ/."
  examples:
    en: "f**a**ce, v**a**gue, d**a**y"

oʊ:
  name: close-mid back rounded diphthong
  image: null
  audio: null
  video: null
  notes:
    en: "American English GOAT vowel — `o` in `go`, `home`, `stone`. British RP uses /əʊ/ instead."
  examples:
    en: "g**oa**t, g**o**, h**o**me"

ɔɪ:
  name: open-mid back to near-close front diphthong
  image: null
  audio: null
  video: null
  notes:
    en: "English CHOICE vowel — `oi` in `boy`, `coin`, `voice`."

# -- English: rhotic vowel sequences (American English) --
  examples:
    en: "ch**oi**ce, b**oy**, c**oi**n"

ɹ:
  name: voiced alveolar approximant
  image: null
  audio: null
  video: null
  notes:
    en: "English `r` in `red`, `right`, `very`. Tongue tip approaches (but doesn't touch) the alveolar ridge. Very different from Spanish trilled /r/ or French uvular /ʁ/."

ɑːɹ:
  name: open back unrounded vowel + rhotic (START)
  image: null
  audio: null
  video: null
  notes:
