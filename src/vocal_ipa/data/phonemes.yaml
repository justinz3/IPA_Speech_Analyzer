# === Japanese (Phase 5b) ===

aː:
  name: 'open central long vowel'
  image: null
  audio: null
  video: null
  notes:
    ja: "Long /a/ — Japanese moraic vowel doubling (e.g. お母さん o-ka-a-san). Pyopenjtalk emits 'a a' which we collapse to 'aː'."

iː:
  name: 'close front long vowel'
  image: null
  audio: null
  video: null
  notes:
    en: "English FLEECE vowel — `ee` in `see`, `feet`, `machine`."
    ja: "Long /i/ — moraic vowel doubling (e.g. 良い yo-i not lengthened, but おにいさん o-ni-i-san is)."
  examples:
    en: "fl**ee**ce, s**ee**, b**e**"

uː:
  name: 'close back long vowel'
  image: null
  audio: null
  video: null
  notes:
    en: "English GOOSE vowel — `oo` in `food`, `blue`, `through`."
    ja: "Long /u/ — common in loanwords and certain native words (e.g. 風船 fu-u-sen)."
  examples:
    en: "g**oo**se, bl**ue**, n**ew**"

kʲ:
  name: 'voiceless palatalized velar plosive'
  image: null
  audio: null
  video: null
  notes:
    ja: "Japanese ky- onset (e.g. きゃ きゅ きょ). Velar /k/ with simultaneous palatalization."
  examples:
    ja: "**きょ**うかい (kyoukai)"

pʲ:
  name: 'voiceless palatalized bilabial plosive'
  image: null
  audio: null
  video: null
  notes:
    ja: "Japanese py- onset (e.g. ぴゃ ぴゅ ぴょ)."
  examples:
    ja: "はっ**ぴょ**う (happyou)"

bʲ:
  name: 'voiced palatalized bilabial plosive'
  image: null
  audio: null
  video: null
  notes:
    ja: "Japanese by- onset (e.g. びゃ びゅ びょ)."
  examples:
    ja: "**びょ**うき (byouki)"

dʑ:
  name: 'voiced alveolo-palatal affricate'
  image: null
  audio: null
  video: null
  notes:
    ja: "Japanese j- onset (e.g. じ じゃ じゅ じょ). Realized as [ʑ] intervocalically."
  examples:
    ja: "**じょ**じょ (jojo), かん**じゃ** (kanja)"

ç:
  name: 'voiceless palatal fricative'
  image: null
  audio: null
  video: null
  notes:
    ja: "Japanese hy- onset (e.g. ひ ひゃ ひゅ ひょ). Allophone of /h/ before /i/ and /j/."
  examples:
    ja: "**ひ**と (hito), **ひょ**う (hyou)"

ɸ:
  name: 'voiceless bilabial fricative'
  image: null
  audio: null
  video: null
  notes:
    ja: "Japanese f- onset (e.g. ふ ふぁ ふぃ ふぇ). Bilabial, not labiodental like English /f/."
  examples:
    ja: "**ふ**じ (fuji)"

mʲ:
  name: 'voiced palatalized bilabial nasal'
  image: null
  audio: null
  video: null
  notes:
    ja: "Japanese my- onset (e.g. みゃ みゅ みょ)."
  examples:
    ja: "**みゃ**く (myaku)"

rʲ:
  name: 'voiced palatalized alveolar approximant'
  image: null
  audio: null
  video: null
  notes:
    ja: "Japanese ry- onset (e.g. りゃ りゅ りょ). Vocab uses rʲ; phonetically closer to ɾʲ but ɾʲ isn't a model token."

ɴ:
  name: 'voiced uvular nasal'
  image: null
  audio: null
  video: null
  notes:
    ja: "Japanese moraic nasal (-ん, the special 'N' phoneme). Realized as [m n ŋ ɴ] depending on context; ɴ is the canonical citation form."
  examples:
    ja: "に**ほ**ん (nihon — final N)"

ʔ:
  name: 'glottal stop'
  image: null
  audio: null
  video: null
  notes:
    ja: "Japanese geminate marker (small っ — pyopenjtalk emits 'cl'). The ʔ token is the closest closure event in the model vocab; phonetically closer to consonant length than a true glottal stop."

# Model-output tokens for Japanese: wav2vec2-lv-60-espeak-cv-ft emits these
# English-like tokens when transcribing Japanese audio because espeak's ja
# voice was broken during training, producing degraded (English-like) labels.
# They appear in ja golden files and must be in the inventory to avoid null
# lookups at runtime.
aɪ:
  name: 'near-open front unrounded diphthong'
  image: null
  audio: null
  video: null
  notes:
    en: "English `I` in `price`, `time`, `high`. Glides from /a/ to /ɪ/."
    ja: "English diphthong /aɪ/ emitted by the wav2vec2 model for some Japanese vowel sequences. Artifact of degraded espeak-ja training labels; not a native Japanese phoneme."
  examples:
    en: "pr**i**ce, p**ie**, fl**y**"

e̞:
  name: 'mid front unrounded vowel (lowered)'
  image: null
  audio: null
  video: null
  notes:
    ja: "Lowered /e/ emitted by the wav2vec2 model for Japanese /e/ sounds. The ̞ diacritic indicates lowering toward [ɛ]. Artifact of English-influenced training labels."

