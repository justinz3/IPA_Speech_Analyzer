# Sparse hand-written tips for common (expected, produced) error pairs.
# When no override matches, the UI still shows expected vs produced
# reference media — the tip is purely additive prose. Sourced from
# spanish_failure_modes.md and french_failure_modes.md.

# -- Spanish --

- lang: es
  expected: β
  produced: v
  title: Don't use English [v]
  tip: |
    Lips touch lightly without contact between lower lip and upper teeth.
    Same articulation as a Spanish `b` between vowels — bilabial, not
    labiodental.

- lang: es
  expected: ɾ
  produced: r
  title: Tap, not a trill
  tip: |
    Spanish single `r` is a flap, same articulation as the `tt` in
    American English `butter`. Trills are reserved for `rr` (`perro`)
    and word-initial `r` (`rosa`).

- lang: es
  expected: tʃ
  produced: dʒ
  title: Keep `ch` voiceless
  tip: |
    Spanish `ch` stays voiceless even between vowels. English voices its
    `ch` to `j` intervocalically (think `nature`); Spanish doesn't.

- lang: es
  expected: x
  produced: h
  title: Use the back-of-throat scrape
  tip: |
    Spanish `j`/soft `g` is a velar fricative — back-of-throat, like
    clearing your throat. English /h/ is just a breath puff at the
    glottis; the two articulations are quite different.

- lang: es
  expected: a
  produced: aʊ
  title: Don't glide Spanish vowels
  tip: |
    Spanish vowels stay pure from start to end. English vowels glide
    (`now` is /naʊ/, two positions); Spanish `a` stays at one position.

- lang: es
  expected: o
  produced: oɪ
  title: Don't glide Spanish vowels
  tip: |
    Same as above: Spanish `o` doesn't glide. English speakers often
    pull /o/ toward /ɪ/ at the end (`go` → /goʊ/). Spanish keeps it pure.

# -- French --

- lang: fr
  expected: y
  produced: i
  title: Round the lips for /y/
  tip: |
    Hold the lips in a strict whistle/kiss shape, then say "ee". The lip
    shape carries the rounding while the tongue stays in the /i/ position.

- lang: fr
  expected: ø
  produced: eː
  title: Round the lips for /ø/
  tip: |
    Same rounding as /y/, but the tongue is at /e/ height instead of /i/.
    Hold the lips in the kiss shape, then say "ay" (as in French `é`).

- lang: fr
  expected: œ
  produced: ø
  title: Open the jaw a bit more
  tip: |
    /œ/ is the same lip shape as /ø/, but the jaw drops slightly. Like
    going from `peu` (/pø/) to `peur` (/pœʁ/) — open up.

- lang: fr
  expected: ʁ
  produced: ∅
  title: Don't drop the French /ʁ/
  tip: |
    French `r` is a back-of-throat uvular — same zone as Spanish `j` or
    German `ach`. English speakers reaching for /r/ often produce
    nothing recognizable; the model hears silence. Aim for a soft scrape
    at the back of the throat.

- lang: fr
  expected: ɛ̃
  produced: ɑ̃
  title: Front nasal, not back
  tip: |
    /ɛ̃/ (`vin`, `pain`) is a front-mouth nasal vowel — no English
    analogue. /ɑ̃/ (`grand`) is a back-mouth nasal — closer to `haunt`
    without the /t/. They're distinct vowels; substituting the back one
    for the front one is a common L2 simplification.

- lang: fr
  expected: t
  produced: tʃ
  title: Don't affricate before /y/
  tip: |
    English speakers hitting /t/ + front rounded /y/ tend to slide into
    a `ch` sound (`tube` → "choob"). Brace the tongue tip forward and
    keep /t/ a clean stop into the /y/.

- lang: fr
  expected: d
  produced: dʒ
  title: Don't affricate before /ø/
  tip: |
    Same pattern as /t/ → /tʃ/: English speakers slide /d/ into a `j`
    sound before front rounded vowels (`deux` → "joo"). Keep /d/ a
    clean stop.

# -- English --

- lang: en
  expected: θ
  produced: f
  title: Use dental [θ], not labiodental [f]
  tip: |
    Put the tongue tip gently between (or just behind) the upper teeth.
    English "th" in "thin", "think", "through" — tongue visible at the
    teeth, no lip–tooth contact. /f/ is made with the lower lip against
    the upper teeth.

- lang: en
  expected: θ
  produced: t
  title: Use dental [θ], not alveolar [t]
  tip: |
    English "th" in "thin" requires the tongue tip between the teeth.
    /t/ is made with the tongue tip at the alveolar ridge (roof of mouth).
    Extend the tongue forward until it touches the teeth.

- lang: en
  expected: ð
  produced: d
  title: Use voiced dental [ð], not [d]
  tip: |
    English "th" in "this", "the", "there". Same placement as /θ/ but
    with vocal cords vibrating. /d/ is made at the alveolar ridge;
    /ð/ needs the tongue tip between the teeth.

- lang: en
  expected: ɪ
  produced: iː
  title: KIT vowel is short and lax — not FLEECE
  tip: |
    English "i" in "bit", "sit" (/ɪ/) is shorter and more relaxed than
    the "ee" in "see" (/iː/). Let the tongue drop slightly from full /iː/
    height. Holding /iː/ too long in unstressed syllables is a common
    non-native pattern.
